server.port=8080

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:dataintelligence;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AI & Search Configuration
# Set these as environment variables before running
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
tavily.api.key=${TAVILY_API_KEY}

# CORS & Actuator
management.endpoints.web.exposure.include=*

# LangGraph local enrichment agent (:2024)
langgraph.enabled=true
langgraph.base-url=http://127.0.0.1:2024
langgraph.max-wait-seconds=15
langgraph.poll-interval-ms=2000
