# ============================================================
# Production profile: MySQL database (Aiven / Cloud MySQL)
# Activate with: java -jar app.jar --spring.profiles.active=prod
# Required environment variables:
#   DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# Optional:
#   LANGGRAPH_BASE_URL, GEMINI_API_KEY, TAVILY_API_KEY
# ============================================================

server.port=${PORT:8080}

# MySQL datasource (Aiven MySQL SSL compatible)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:defaultdb}?useSSL=true&requireSSL=true&verifyServerCertificate=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate - auto-create/update tables on first deployment
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 console MUST be disabled in production
spring.h2.console.enabled=false

# AI & Search — read from environment
gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
tavily.api.key=${TAVILY_API_KEY}

# LangGraph enrichment agent orchestration
langgraph.enabled=${LANGGRAPH_ENABLED:true}
langgraph.base-url=${LANGGRAPH_BASE_URL:http://127.0.0.1:2024}
langgraph.max-wait-seconds=${LANGGRAPH_MAX_WAIT_SECONDS:15}
langgraph.poll-interval-ms=${LANGGRAPH_POLL_INTERVAL_MS:2000}

# Actuator — health and info endpoints
management.endpoints.web.exposure.include=health,info

